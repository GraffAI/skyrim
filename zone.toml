# 005 M18 D135 — this zone declares itself. 006 M35: `projects/skyrim` is a clean-room engine that
# runs Skyrim Special Edition's stock data files (ESM/BSA). Its record is docs/design/006-m35-skyrim-recon.md.
name  = "skyrim"
kind  = "project"
description = "clean-room engine for Skyrim SE data; first: behavior-graph reconnaissance"
deps  = []
# Run from this directory. Nothing here needs game files.
# I152: no Bethesda file is tracked here.
gates = ["! git ls-files . | grep -iE '\\.(hkx|bsa|esm|esp|nif|dds)$'",
         "cd tools/bsa && nix shell --inputs-from ../../../.. nixpkgs#cargo nixpkgs#rustc -c cargo test --release -q",
         "bash -n tools/hkx/build_serde_hkx.sh", "bash -n tools/hkx/bulk_convert.sh", "bash -n tools/hkx/roundtrip_check.sh",
         'python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" tools/hkx/hkx_xml_canon.py',
         "python3 -I tools/census/test_census.py",
         'for f in tools/contract/*.py; do python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1; done',
         # the typed model (stretch): strict tsc pinned by the root flake.lock; corpus tests skip without data
         "nix shell --inputs-from ../.. nixpkgs#typescript -c tsc -p model",
         "cd model && node --test 'test/*.test.ts'", "cd model && node gen/generate.ts --check"]
# What the nightly audit's hosted runner (ubuntu, no nix) runs (006 M34 D284): every gate above
# except the two that need nix. dev's default only skips gates whose text STARTS with `nix`, and
# the cargo gate starts with `cd`, so it ran hosted and exited 127 on the first nightly
# (2026-10-16 11:12Z). Both nix gates are local-only, like machines' `nix build`.
hosted = ["! git ls-files . | grep -iE '\\.(hkx|bsa|esm|esp|nif|dds)$'",
          "bash -n tools/hkx/build_serde_hkx.sh", "bash -n tools/hkx/bulk_convert.sh", "bash -n tools/hkx/roundtrip_check.sh",
          'python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" tools/hkx/hkx_xml_canon.py',
          "python3 -I tools/census/test_census.py",
          'for f in tools/contract/*.py; do python3 -I -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1; done',
          "cd model && node --test 'test/*.test.ts'", "cd model && node gen/generate.ts --check"]

# 006 M37 D300: published, read-only, to its own repository by `dev mirror push` on the anchor.
[public]
repo    = "GraffAI/skyrim"
license = "MIT"
history = "snapshot"
# Held back until the operator decides (006 M37 §7): files marked DIRTY-SIDE (D289),
# informed by reverse-engineered sources. Publishing cannot be undone; dropping a line here can.
exclude = ["ORACLE.md", "semantics", "tools/contract"]
